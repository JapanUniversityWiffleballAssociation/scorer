<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUWA 試合速報システム - 成績閲覧</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* レイアウト全体設定 */
        .stats-layout { display: flex; flex-direction: column; gap: 20px; }

        /* --- 絞り込みアコーディオン (JSなし) --- */
        details.filter-accordion {
            background: #2c3e50;
            border-radius: 10px;
            border: 1px solid #444;
            overflow: hidden;
        }
        summary.filter-summary {
            padding: 15px 20px;
            font-weight: bold;
            color: var(--primary, #2ecc71);
            cursor: pointer;
            background: #34495e;
            display: flex;
            justify-content: space-between;
            list-style: none;
        }
        summary.filter-summary::after { content: '▼絞り込み'; font-size: 0.8rem; }
        details[open] summary.filter-summary::after { content: '▲閉じる'; }

        /* --- 条件指定の表形式レイアウト --- */
        .filter-table-container {
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3列（大会・チーム・試合） */
            gap: 15px;
            background: #2c3e50;
        }

        .filter-column {
            background: #1a1a1a;
            border-radius: 6px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            height: 200px; /* スクロールさせるための固定高 */
        }

        .column-header {
            background: #34495e;
            padding: 8px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: bold;
            color: var(--primary, #2ecc71);
            border-bottom: 1px solid #444;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }

        /* 内部のチェックリスト項目 */
        .filter-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            font-size: 0.85rem;
            border-bottom: 1px solid #2c3e50;
            cursor: pointer;
        }
        .filter-item:hover { background: #2c3e50; }
        .filter-item input { cursor: pointer; }

        /* 検索ボタンエリア */
        .filter-footer {
            padding: 10px 15px;
            background: #34495e;
            text-align: right;
        }

        /* --- 結果表示エリア（チーム枠） --- */
        .team-section {
            border: 2px solid var(--primary, #2ecc71);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
            background: #2c3e50;
        }
        .team-header {
            background: var(--primary, #2ecc71);
            color: #1a1a1a;
            padding: 10px 15px;
            font-weight: bold;
        }
        .table-label {
            background: #1a202c;
            color: #bdc3c7;
            padding: 5px 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .pitcher-label { border-left: 4px solid #3498db; }
        .batter-label { border-left: 4px solid #e67e22; }

        .stats-table-wrapper { overflow-x: auto; }
        table.stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .stats-table th, .stats-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #3d4e5f;
        }

        /* モバイル対応（3列を縦に並べる） */
        @media (max-width: 600px) {
            .filter-table-container { grid-template-columns: 1fr; }
            .filter-column { height: 150px; }
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 950px;">
        <div class="viewer-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button type="button" class="btn-sm" onclick="location.href='index.html'">メニューに戻る</button>
            <h1 style="color: var(--primary, #2ecc71); margin: 0; font-size: 1.4rem;">成績データ閲覧</h1>
        </div>

        <div class="stats-layout">
            <details class="filter-accordion" open>
                <summary class="filter-summary">検索フィルタ</summary>
                
                <div class="filter-table-container">
                    <div class="filter-column">
                        <div class="column-header">大会名</div>
                        <div class="scroll-area">
                            <label class="filter-item"><input type="checkbox"> 2024 春季リーグ</label>
                            <label class="filter-item"><input type="checkbox"> JUWAカップ</label>
                            <label class="filter-item"><input type="checkbox"> 夏季トーナメント</label>
                            <label class="filter-item"><input type="checkbox"> 秋季新人戦</label>
                        </div>
                    </div>
                    <div class="filter-column">
                        <div class="column-header">チーム名</div>
                        <div class="scroll-area">
                            <label class="filter-item"><input type="checkbox"> 東京パイレーツ</label>
                            <label class="filter-item"><input type="checkbox"> 横浜マリンズ</label>
                            <label class="filter-item"><input type="checkbox"> 千葉ピーナッツ</label>
                            <label class="filter-item"><input type="checkbox"> 埼玉ブルース</label>
                            <label class="filter-item"><input type="checkbox"> 名古屋スターズ</label>
                        </div>
                    </div>
                    <div class="filter-column">
                        <div class="column-header">試合</div>
                        <div class="scroll-area">
                            <label class="filter-item"><input type="checkbox"> 5/1 vs 横浜</label>
                            <label class="filter-item"><input type="checkbox"> 5/5 vs 千葉</label>
                            <label class="filter-item"><input type="checkbox"> 5/10 vs 埼玉</label>
                            <label class="filter-item"><input type="checkbox"> 5/15 vs 東京</label>
                        </div>
                    </div>
                </div>

                <div class="filter-footer">
                    <button class="btn" style="width: auto; padding: 8px 30px;">この条件で表示</button>
                </div>
            </details>

            <div class="results-area">
                <section class="team-section">
                    <div class="team-header">東京パイレーツ</div>
                    
                    <div class="table-label pitcher-label">投手成績</div>
                    <div class="stats-table-wrapper">
                        <table class="stats-table">
                            <thead>
                                <tr><th>選手名</th><th>登板</th><th>防御率</th><th>奪三振</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>田中 将也</td><td>3</td><td>1.76</td><td>12</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div style="height: 1px; background: #444;"></div>

                    <div class="table-label batter-label">野手成績</div>
                    <div class="stats-table-wrapper">
                        <table class="stats-table">
                            <thead>
                                <tr><th>選手名</th><th>打率</th><th>安打</th><th>本塁打</th><th>OPS</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>山田 太郎</td><td>.350</td><td>7</td><td>1</td><td>.950</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>
</body>
</html>
