<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUWA 試合速報システム - 試合登録</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #out-base-select-dialog-overlay .modal-content {
            max-width: 420px;
        }

        .out-base-diamond {
            position: relative;
            width: min(100%, 280px);
            aspect-ratio: 1.15;
            margin: 12px auto;
        }

        .out-base-arrows,
        .out-base-options {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .out-base-options {
            pointer-events: none;
        }

        .out-base-option {
            position: absolute;
            z-index: 1;
            width: 66px;
            min-height: 54px;
            padding: 5px 3px;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border: 0;
            background: transparent;
            color: #333;
            cursor: pointer;
            pointer-events: auto;
        }

        .out-base-option:active {
            transform: translate(-50%, -50%);
        }

        .out-base-marker {
            display: block;
            width: 23px;
            height: 23px;
            border: 2px solid #667085;
            background: #dfe3e8;
            transform: rotate(45deg);
        }

        .out-base-marker.runner-marker {
            border-radius: 50%;
            border-color: #e67e22;
            background: #f39c12;
            transform: none;
        }

        .out-base-option.is-selected .out-base-marker {
            box-shadow: 0 0 0 4px #3498db;
        }

        .out-base-option.is-out .out-base-marker {
            position: relative;
            border-color: #c0392b;
            background: #fff;
            box-shadow: 0 0 0 3px #c0392b;
        }

        .out-base-option.is-out .out-base-marker::before,
        .out-base-option.is-out .out-base-marker::after {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 25px;
            height: 3px;
            border-radius: 2px;
            background: #c0392b;
            content: "";
        }

        .out-base-option.is-out .out-base-marker::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .out-base-option.is-out .out-base-marker::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        .out-base-option.is-moving .out-base-marker {
            border-color: #2980b9;
            background: #3498db;
        }

        .out-base-label {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .out-base-arrows {
            overflow: visible;
            pointer-events: none;
        }

        .out-base-arrow {
            stroke: #2980b9;
            stroke-width: 4;
            stroke-linecap: round;
            marker-end: url(#out-base-arrowhead);
        }

        #out-base-select-error {
            min-height: 1.5em;
            margin: 8px 0 0;
            color: #c0392b;
            font-weight: 600;
        }

        .input-group .extra-rules-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            cursor: pointer;
        }

        .input-group .extra-rules-toggle input {
            flex: 0 0 auto;
            width: auto;
            min-height: 0;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="setup-screen" class="overlay">
        <div class="container">
        <div class="card">
        
            <h2>試合設定 & 同期</h2>
            <div class="input-group">
                <label>参加する大会を選択<br>（大会を選択すると追加の設定画面が表示されます。）</label>
                <select id="select-league" onchange="handleLeagueSelect()">
                    <option value="">リーグを読み込み中...</option>
                </select>
            </div>

            <div id="mode-selection" class="hidden" style="margin-top: 20px;">
                <label>操作モードを選択</label>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="button" class="btn-sm" onclick="showNewGameForm()" style="flex:1; background:#2ecc71; color:white;">新規試合を作成</button>
                    <button type="button" class="btn-sm" onclick="showExistingGameForm()" style="flex:1; background:#3498db; color:white;">既存試合を編集</button>
                </div>
            </div>

            <div id="new-game-form" class="hidden" style="margin-top: 20px; border-top: 1px solid #555; padding-top: 15px;">
                <div class="input-group">
                    <label>試合ID</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="input-game-id" readonly placeholder="自動発行してください" style="width: 60%;">
                        <button type="button" id="gen-id-btn" class="btn-sm">自動発行</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>先攻チーム</label>
                    <div style="display: flex; gap: 5px;">
                    <select id="top-team-name" style="width: 60%;">
                        <option value="loading">チーム情報を読み込み中...</option>
                    </select>
                    <button type="button" id="edit-top-member" onclick="setMemberData(false)">メンバー編集</button>
                    </div>
                </div>
                <div class="input-group">
                    <label>後攻チーム</label>
                    <div style="display: flex; gap: 5px;">
                    <select id="bottom-team-name" style="width: 60%;">
                        <option value="loading">チーム情報を読み込み中...</option>
                    </select>
                    <button type="button" id="edit-bottom-member" onclick="setMemberData(true)">メンバー編集</button>
                    </div>
                </div>
                <div class="input-group">
                <label>イニング数</label>
                <input type="number" id="input-innings" value="3" min="1" max="12" style="width: 30%;">
                </div>
                <div class="input-group">
                    <label>拡張ルール</label>
                    <div style="display: flex; gap: 10px;">
                        <label class="extra-rules-toggle">
                            <input type="checkbox" id="extra-rules-checkbox">
                            拡張ルールを使用する
                        </label>
                    </div>
                </div>
                <button type="button" id="start-btn" class="btn-save">この内容で試合開始</button>
            </div>

            <div id="existing-game-form" class="hidden" style="margin-top: 20px; border-top: 1px solid #555; padding-top: 15px;">
                <div class="input-group">
                    <label>編集する試合を選択</label>
                    <select id="select-existing-game">
                        <option value="">試合を読み込み中...</option>
                    </select>
                </div>
                <button type="button" onclick="resumeGame()" class="btn-save" style="background:#3498db;">編集を再開する</button>
            </div>

            <div id="member-data-form" class="hidden" style="margin-top: 20px; border-top: 1px solid #555; padding-top: 15px;">
                <div class="input-group">
                    <h3 id="setting-team-name">チーム名</h3>
                    <input type="hidden" value="" id="isBottom">
                    <label>投手</label>
                    <div style="display: flex; gap: 5px;">
                    <select id="pitcher-name" style="width: 60%;">
                        <option value="loading">チーム情報を読み込み中...</option>
                    </select>
                    </div>
                </div>
                <div class="input-group">
                    <label>打順</label>
                    <table id="batting-order">
                    <tr>
                        <th style="width: 25%;">打順</th>
                        <th style="width: 50%;">メンバー</th>
                        <th style="width: 25%;">背番号</th>
                    </tr>
                    </table>
                </div>
                <button type="button" id="submit-member" onclick="submitMemberData()" class="btn-save">この内容で確定</button>
            </div>
        </div>
        </div>
    </div>

    <div id="main-app" class="container hidden">
      <div class="viewer-header" style="display: flex; justify-content: space-between; align-items: center;">
            <button type="button" class="btn-sm" onclick="location.href='index.html'">メニューに戻る</button>
        </div>
        <br>
        <div class="header-status">
            <div id="display-game-id">ID: ----</div>
            <div id="sync-status">同期オフライン</div>
        </div>
        <div class="share-section" style="margin-top: 20px; padding: 10px; background: #a1a1a1; border-radius: 5px;">
            <label style="font-size: 12px; color: #000000;">この試合の編集用URL:</label>
            <div id="share-link" style="word-break: break-all; font-family: monospace; font-size: 12px; margin-bottom: 10px; color: #333;">
             (URL生成中...)
            </div>
            <button type="button" onclick="copyShareLink()" class="btn-sm" style="background: #3498db; color: white; width: 100%;">
                URLをコピーする
            </button>
        </div>
        <br>
        <section class="score-board">
        <table id="scoreboard">
            <thead id="scoreboard-head">
            <tr id="header-row">
                <th>チーム</th>
                <th>R</th>
            </tr>
            </thead>
            <tbody id="scoreboard-body">
            <tr id="score-row-top">
                <td id="top-team-name-cell" class="team-name-cell">先攻</td>
                <td class="total-cell" id="total-score-top">0</td>
            </tr>
            <tr id="score-row-bottom">
                <td id="bottom-team-name-cell" class="team-name-cell">後攻</td>
                <td class="total-cell" id="total-score-bottom">0</td>
            </tr>
            </tbody>
        </table>
        </section>
            <button type="button" id="swap-teams-btn" class="btn-sm hidden" style="width:100%; margin-bottom: 12px;">
                先攻・後攻を入れ替える
            </button>
            <section class="pitch-counter-box">
            <div class="match-status-bar">
                <div class="status-item current-pitcher">
                    <span class="label">ピッチャー</span>
                    <span id="display-pitcher-name" class="value">読み込み中...</span>
                </div>

                <div class="status-item pitch-count">
                    <span class="label">PITCHES</span>
                    <span id="display-pitch-count" class="value">0</span>
                </div>

                <div class="status-item current-batter">
                    <span class="label">バッター</span>
                    <span id="display-batter-name" class="value">読み込み中...</span>
                </div>
            </div>
        </section>
        <div class="status-container">
            <section class="counts">
                <div class="count-row">
                    <span class="label">B</span>
                    <div class="dots">
                        <span class="dot ball"></span><span class="dot ball"></span><span class="dot ball"></span>
                    </div>
                </div>
                <div class="count-row">
                    <span class="label">S</span>
                    <div class="dots">
                        <span class="dot strike"></span><span class="dot strike"></span>
                    </div>
                </div>
                <div class="count-row">
                    <span class="label">O</span>
                    <div class="dots">
                        <span class="dot out"></span><span class="dot out"></span>
                    </div>
                </div>    
            </section>

            <section class="diamond">
                <div class="base" id="base2"></div>
                <div class="base" id="base3"></div>
                <div class="base" id="base1"></div>
            </section>
        </div>

        <section class="controls">
<div class="button-group">
    <button type="button" id="strike-btn" class="btn strike">ストライク</button>
    <button type="button" id="ball-btn" class="btn ball">ボール</button>
    <button type="button" id="foul-btn" class="btn strike">ファウル</button>
    <button type="button" id="out-btn" class="btn out">アウト</button>
</div>
<div class="button-group">
    <button type="button" id="single-hit-btn" class="btn hit">シングルヒット</button>
    <button type="button" id="double-hit-btn" class="btn hit">ダブルヒット</button>
    <button type="button" id="triple-hit-btn" class="btn hit">トリプルヒット</button>
    <button type="button" id="hr-btn" class="btn hr">ホームラン</button>
</div>
<div class="button-group hidden" id="additional-style">
    <button type="button" id="clean-single-hit-btn" class="btn hit">クリーンシングル</button>
    <button type="button" id="clean-double-hit-btn" class="btn hit">クリーンダブル</button>
    <button type="button" id="double-play-btn" class="btn out">ダブルプレー</button>
</div>
            <div class="button-group full-width">
                <button type="button" id="undo-btn" class="btn undo">1つ戻る（修正） </button>
            </div>
            <div class="button-group full-width">
                <button type="button" id="change-pitcher-btn" class="btn change-player">投手交代</button>
            </div>
          <div class="button-group full-width" style="margin-top: 10px;">
    <button type="button" id="end-game-btn" class="btn" style="background: #c0392b; border-bottom: 4px solid #a93226;">試合を終了する</button>
</div>
        </section>

        <div id="tiebreak-dialog-overlay" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="icon">⚠</span>
                    <h2>試合続行の確認</h2>
                </div>
                <div class="modal-body">
                    <p>規定イニングで決着がつきませんでした。</p>
                    <p class="highlight-text">タイブレーク（無死一二塁）に進みますか？</p>
                </div>
                <div class="modal-footer">
                    <button id="btn-tiebreak-no" class="btn-secondary">いいえ（引き分け）</button>
                    <button id="btn-tiebreak-yes" class="btn-primary">はい（タイブレーク開始）</button>
                </div>
            </div>
        </div>

        <div id="player-change-dialog-overlay" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="icon">⚠</span>
                    <h2>投手交代</h2>
                </div>
                <div class="modal-body">
                    <p>次のピッチャーを選択してください。</p>
                    <select id="next-pitcher"> <option>--メンバーを読み込み中--</option></select>
                </div>
                <div class="modal-footer">
                    <button id="btn-player-change-yes" class="btn-primary">確定</button>
                    <button id="btn-player-change-no" class="btn-secondary">キャンセル</button>
                </div>
            </div>
        </div>
        <div id="out-base-select-dialog-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="out-base-select-title">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="icon">⚠</span>
                    <h2 id="out-base-select-title">アウト・進塁選択</h2>
                </div>
                <div class="modal-body">
                    <p id="out-base-select-instruction">ランナーをタップして選択し、もう一度タップするとアウト。選択したランナーの前方の塁をタップすると進塁矢印が表示されます。</p>
                    <div id="out-base-select-board"></div>
                    <p id="out-base-select-error" role="alert" aria-live="polite"></p>
                    <input type="checkbox" id="sacrifice-hit">
                    <label for="sacrifice-hit">犠打として登録する。</label>
                    <br>
                    <input type="checkbox" id="sacrifice-fly">
                    <label for="sacrifice-fly">犠飛として登録する。</label>
                </div>
                <div class="modal-footer">
                    <button id="btn-out-base-select-yes" class="btn-primary">確定</button>
                    <button id="btn-out-base-select-no" class="btn-secondary">キャンセル</button>
                </div>
                </div>
            </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/edit-games.js"></script>
</body>
</html>
