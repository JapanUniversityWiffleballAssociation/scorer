<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チーム情報編集 - JUWA Scorer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 
       不要なデザイン設定（色、背景、ボーダーなど）を削除し、
       style.css のダークテーマを活かしたまま、レイアウト微調整のみ残します。
    */

    /* プルダウン用のタイトルエリア */
    .page-title {
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--primary); /* CSS変数の色を利用 */
    }

    /* バッジ（申請件数などの表示用） */
    .badge {
      background: var(--danger);
      color: white;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 12px;
      margin-left: 10px;
      display: none; /* 初期は非表示 */
    }

    /* フォーム部品の調整（幅のみ） */
    .number-input { 
      width: 60px; /* スマホでも見やすいように少し細く */
      text-align: center; /* 数字を中央揃えに */
    }

    /* ボタン群の配置 */
    .action-cell {
      display: flex;
      flex-direction: column; /* スマホを考慮して縦並びに */
      gap: 5px;
    }
    
    @media (min-width: 600px) {
      .action-cell {
        flex-direction: row; /* 画面が広い場合は横並びに */
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 変更前 -->
    <!--
    <div class="page-title">
      <span id="displayTeamName">チーム情報を読み込み中...</span>
      <a href="menu.html" style="font-size: 1rem; color: #007bff; text-decoration: none;">メニューに戻る</a>
    </div>
    -->

    <!-- 変更後（プルダウンの追加） -->
    <div class="page-title">
      <div style="display: flex; align-items: center; gap: 10px;">
        <select id="adminTeamSelect" class="form-control" style="width: auto; min-width: 250px; font-size: 1.1rem; padding: 5px 10px;">
          <option value="" disabled selected>管理チームを読み込み中...</option>
        </select>
      </div>
    </div>

    <!-- セクション1: 加入申請待ち -->
    <div class="card" id="requestSection">
      <h3>加入申請待ち <span class="badge" id="requestBadge">0</span></h3>
      <table>
        <thead>
          <tr>
            <th>申請者名</th>
            <th>希望背番号</th>
            <th>利き手</th>
            <th>申請日</th>
            <th>アクション</th>
          </tr>
        </thead>
        <tbody id="requestTableBody">
          <tr>
            <td colspan="5" class="empty-message">読み込み中...</td>
          </tr>
          <!-- JSでここに以下の行を生成します
          <tr>
            <td>player name</td>
            <td>18</td>
            <td>右投右打</td>
            <td>2026/09/07</td>
            <td class="action-cell">
              <button class="btn btn-approve">承認</button>
              <button class="btn btn-reject">拒否</button>
            </td>
          </tr>
          -->
        </tbody>
      </table>
    </div>

    <!-- セクション2: 現在のメンバー管理 -->
    <div class="card">
      <h3>メンバー情報の編集</h3>
      <table>
        <thead>
          <tr>
            <th>選手名</th>
            <th>背番号</th>
            <th>利き手</th>
            <th>ポジション</th>
            <th>アクション</th>
          </tr>
        </thead>
        <tbody id="memberTableBody">
          <tr>
            <td colspan="5" class="empty-message">読み込み中...</td>
          </tr>
          <!-- JSでここに以下の行を生成します
          <tr>
            <td>player name</td>
            <td><input type="number" class="form-control number-input" value="1"></td>
            <td>
              <select class="form-control">
                <option value="右投右打">右投右打</option>
                ...
              </select>
            </td>
            <td>
              <select class="form-control">
                <option value="投手">投手</option>
                <option value="野手">野手</option>
              </select>
            </td>
          </tr>
          -->
        </tbody>
      </table>
      <button id="saveMembersBtn" class="btn btn-save">メンバー情報を保存する</button>
    </div>

  </div>

  <!-- 先ほど自作した共通ダイアログ等を使えるように読み込む -->
  <script src="js/common.js"></script>
  <script src="js/team-edit.js"></script>
</body>
</html>
