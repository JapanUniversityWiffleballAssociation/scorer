<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チーム情報編集 - JUWA Scorer</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 
       不要なデザイン設定（色、背景、ボーダーなど）を削除し、
       style.css のダークテーマを活かしたまま、レイアウト微調整のみ残します。
    */

    /* プルダウン用のタイトルエリア */
    .page-title {
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--primary); /* CSS変数の色を利用 */
    }

    /* バッジ（申請件数などの表示用） */
    .badge {
      background: var(--danger);
      color: white;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 12px;
      margin-left: 10px;
      display: none; /* 初期は非表示 */
    }

    /* フォーム部品の調整（幅のみ） */
    .number-input { 
      width: 60px; /* スマホでも見やすいように少し細く */
      text-align: center; /* 数字を中央揃えに */
    }

    /* ボタン群の配置 */
    .action-cell {
      display: flex;
      flex-direction: column; /* スマホを考慮して縦並びに */
      gap: 5px;
    }
    
    @media (min-width: 600px) {
      .action-cell {
        flex-direction: row; /* 画面が広い場合は横並びに */
      }
    }

    /* プレイヤーIDバッジ */
    .player-id-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: Consolas, monospace;
      font-size: 0.85rem;
      background: #2c3e50;
      color: #00d2d3;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #34495e;
      cursor: pointer;
      user-select: all;
    }
    .player-id-badge:hover {
      background: #34495e;
    }

    /* 権限バッジ */
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .role-badge.role-admin {
      background: #e67e22;
      color: #fff;
    }
    .role-badge.role-admin:hover {
      background: #d35400;
    }
    .role-badge.role-member {
      background: #34495e;
      color: #bdc3c7;
    }
    .role-badge.role-member:hover {
      background: #2c3e50;
      color: #ecf0f1;
    }

    /* テーブル横スクロール */
    .table-scroll-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 -5px;
      padding: 0 5px;
    }
    .table-scroll-wrapper table {
      min-width: 700px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 変更前 -->
    <!--
    <div class="page-title">
      <span id="displayTeamName">チーム情報を読み込み中...</span>
      <a href="menu.html" style="font-size: 1rem; color: #007bff; text-decoration: none;">メニューに戻る</a>
    </div>
    -->

    <!-- 変更後（プルダウンの追加） -->
    <div class="page-title">
      <div style="display: flex; align-items: center; gap: 10px;">
        <select id="adminTeamSelect" class="form-control" style="width: auto; min-width: 250px; font-size: 1.1rem; padding: 5px 10px;">
          <option value="" disabled selected>管理チームを読み込み中...</option>
        </select>
      </div>
    </div>

    <!-- セクション1: 加入申請待ち -->
    <div class="card" id="requestSection">
      <h3>加入申請待ち <span class="badge" id="requestBadge">0</span></h3>
      <div class="table-scroll-wrapper">
        <table>
          <thead>
            <tr>
              <th>申請者名</th>
              <th>希望背番号</th>
              <th>利き手</th>
              <th>申請日</th>
              <th>アクション</th>
            </tr>
          </thead>
          <tbody id="requestTableBody">
            <tr>
              <td colspan="5" class="empty-message">読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- セクション2: 現在のメンバー管理 -->
    <div class="card">
      <h3>メンバー情報の編集</h3>
      <div class="table-scroll-wrapper">
        <table>
          <thead>
            <tr>
              <th>選手名</th>
              <th>プレイヤーID</th>
              <th>背番号</th>
              <th>利き手</th>
              <th>ポジション</th>
              <th>権限</th>
              <th>アクション</th>
            </tr>
          </thead>
          <tbody id="memberTableBody">
            <tr>
              <td colspan="7" class="empty-message">読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <button id="saveMembersBtn" class="btn btn-save">メンバー情報を保存する</button>
    </div>

    <div class="card">
      <h3>ログインしない選手を追加</h3>
      <p>ログインアカウントは作成せず、チームに所属する選手として登録してプレイヤーIDを発行します。</p>
      <div class="form-group">
        <label for="newMemberName">選手名 <span aria-hidden="true">*</span></label>
        <input id="newMemberName" class="form-control" type="text" maxlength="100" required>
      </div>
      <div class="form-group">
        <label for="newMemberNumber">背番号</label>
        <input id="newMemberNumber" class="form-control number-input" type="number" min="0" max="999">
      </div>
      <div class="form-group">
        <label for="newMemberHandedness">利き手</label>
        <select id="newMemberHandedness" class="form-control">
          <option value="未設定">未設定</option>
          <option value="右投右打">右投右打</option>
          <option value="右投左打">右投左打</option>
          <option value="左投左打">左投左打</option>
          <option value="左投右打">左投右打</option>
        </select>
      </div>
      <div class="form-group">
        <label for="newMemberPos">ポジション</label>
        <select id="newMemberPos" class="form-control">
          <option value="未設定">未設定</option>
          <option value="投手">投手</option>
          <option value="内野手">内野手</option>
          <option value="外野手">外野手</option>
          <option value="指名打者">指名打者</option>
        </select>
      </div>
      <button id="addUnregisteredMemberBtn" class="btn btn-save" type="button">選手を追加してプレイヤーIDを発行</button>
      <p id="issuedPlayerIdMessage" role="status" hidden>
        発行されたプレイヤーID: <span id="issuedPlayerId" class="player-id-badge"></span>
        <button id="copyIssuedPlayerIdBtn" class="btn btn-sm" type="button">コピー</button>
      </p>
    </div>

  </div>

  <!-- 先ほど自作した共通ダイアログ等を使えるように読み込む -->
  <script src="js/common.js"></script>
  <script src="js/team-edit.js"></script>
</body>
</html>
