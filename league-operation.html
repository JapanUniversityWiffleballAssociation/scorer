<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大会運営・管理 - JUWA Scorer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --primary: #2ecc71; --bg: #1a1a1a; --card: #2c3e50; --text: #ecf0f1; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; }
        h1, h2, h3 { color: var(--primary); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #bdc3c7; }
        input, select { width: 100%; padding: 12px; border: none; border-radius: 5px; background: #34495e; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* タブナビゲーション */
        .tab-bar { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; background: #34495e; border: none; border-radius: 8px; color: #bdc3c7; font-weight: bold; cursor: pointer; font-size: 0.95rem; text-align: center; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }

        /* ステータスバッジ */
        .badge-status { font-size: 0.8rem; padding: 3px 8px; border-radius: 10px; color: white; font-weight: bold; display: inline-block; }
        .badge-pending { background: #f39c12; }
        .badge-approved { background: #2ecc71; }
        .badge-rejected { background: #e74c3c; }

        /* 申し込み一覧テーブル */
        .entry-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .entry-table th, .entry-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #34495e; font-size: 0.9rem; vertical-align: middle; }
        .entry-table th { background: rgba(0,0,0,0.2); color: #bdc3c7; }
        .entry-action-btns { display: flex; gap: 5px; flex-wrap: wrap; }
        .btn-sm { padding: 5px 8px; border: none; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: bold; color: white; }
        .btn-approve { background: #2ecc71; }
        .btn-reject { background: #e74c3c; }
        .btn-reset { background: #7f8c8d; }

        /* 概要カード */
        .summary-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-around; text-align: center; }
        .summary-item .num { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
        .summary-item .label { font-size: 0.8rem; color: #bdc3c7; }

        .nav-link { text-align: center; display: block; color: var(--primary); text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center;">🏆 大会運営・管理</h1>

    <!-- 大会選択エリア -->
    <section class="card" style="margin-bottom: 20px;">
        <label style="font-weight: bold; font-size: 1rem; color: #ecf0f1;">運営する大会を選択</label>
        <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
            <select id="adminLeagueSelect" style="flex: 1; font-size: 1.05rem;">
                <option value="">管理している大会を読み込み中...</option>
            </select>
            <span id="league-status-badge" class="badge-status" style="display: none;">受付中</span>
        </div>
    </section>

    <!-- メインコンテンツ（大会選択後に表示） -->
    <div id="league-content" style="display: none;">
        <!-- タブボタン -->
        <div class="tab-bar">
            <button type="button" class="tab-btn active" id="tab-btn-entries" onclick="switchTab('entries')">📋 申し込み管理 <span id="entry-count-badge">(0)</span></button>
            <button type="button" class="tab-btn" id="tab-btn-info" onclick="switchTab('info')">⚙️ 大会情報の変更</button>
        </div>

        <!-- タブ1: 申し込み管理 -->
        <section id="tab-panel-entries">
            <div class="summary-card">
                <div class="summary-item">
                    <div class="num" id="summary-approved-teams">0</div>
                    <div class="label">参加確定 / 上限</div>
                </div>
                <div class="summary-item">
                    <div class="num" id="summary-total-entries">0</div>
                    <div class="label">申込総数</div>
                </div>
                <div class="summary-item">
                    <div class="num" id="summary-deadline" style="font-size: 1rem; margin-top: 5px;">-</div>
                    <div class="label">変更期日</div>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table class="entry-table">
                    <thead>
                        <tr>
                            <th>チーム名</th>
                            <th>登録選手</th>
                            <th>申込日時</th>
                            <th>状態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="entry-table-body">
                        <tr>
                            <td colspan="5" style="text-align: center; color: #bdc3c7;">読み込み中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- タブ2: 大会情報の変更 -->
        <section id="tab-panel-info" style="display: none;">
            <div class="card">
                <div class="input-group">
                    <label>大会略称 (ID・変更不可)</label>
                    <input type="text" id="edit-league-id" disabled style="opacity: 0.7; cursor: not-allowed;">
                </div>
                <div class="input-group">
                    <label>正式名称 (表示用)</label>
                    <input type="text" id="edit-league-name" placeholder="例: 2026年度 春季リーグ">
                </div>
                <div class="input-group">
                    <label>大会ステータス</label>
                    <select id="edit-league-status">
                        <option value="受付中">受付中</option>
                        <option value="開催中">開催中</option>
                        <option value="終了">終了</option>
                    </select>
                </div>

                <!-- 試合レギュレーション -->
                <div class="input-group">
                    <label>試合レギュレーション</label>
                    <select id="edit-league-match-regulation">
                        <option value="JAPAN">日本ルール</option>
                        <option value="FAST_PITCH">ファストピッチルール</option>
                        <option value="CLASSIC">クラシックルール</option>
                        <option value="ORIGINAL">オリジナルルール</option>
                    </select>
                </div>

                <!-- 大会形式 -->
                <div class="input-group">
                    <label>大会形式（本戦フォーマット）</label>
                    <select id="edit-league-regulation">
                        <option value="TOURNAMENT">トーナメント（シングル）</option>
                        <option value="TOURNAMENT_DOUBLE">トーナメント（ダブルエリミネーション）</option>
                        <option value="LEAGUE">リーグ戦（総当たり）</option>
                        <option value="OTHER">別フォーマット・特殊</option>
                    </select>
                </div>

                <!-- 予選設定 -->
                <div class="input-group">
                    <label>予選の有無</label>
                    <select id="edit-league-qualifier">
                        <option value="false">なし（本戦のみ）</option>
                        <option value="true">あり</option>
                    </select>
                </div>
                <div id="edit-qualifier-settings" class="input-group" style="display: none; padding: 15px; background: rgba(255,255,255,0.05); border-left: 4px solid #f1c40f; border-radius: 4px;">
                    <label style="color: #f1c40f;">予選フォーマット</label>
                    <select id="edit-league-qualifier-regulation" style="margin-top: 5px;">
                        <option value="LEAGUE">総当たりリーグ戦</option>
                        <option value="TOURNAMENT">トーナメント（シングル）</option>
                        <option value="TOURNAMENT_DOUBLE">トーナメント（ダブルエリミネーション）</option>
                        <option value="OTHER">別フォーマット・特殊</option>
                    </select>
                </div>

                <!-- チーム募集要項 -->
                <div class="input-group">
                    <label>チーム募集要項</label>
                    <div style="background: rgba(255,255,255,0.05); border: 1px solid #34495e; border-radius: 5px; padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                        <div>
                            <span id="edit-recruitment-summary-badge" class="badge-status" style="background: #3498db;">エントリー制</span>
                            <span id="edit-recruitment-summary-text" style="font-size: 0.85rem; color: #bdc3c7; margin-left: 8px;">上限: 無制限</span>
                        </div>
                        <button type="button" id="edit-open-recruitment-modal-btn" style="background: #34495e; color: #ecf0f1; border: 1px solid #555; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.85rem; white-space: nowrap;">⚙️ 要項を変更</button>
                    </div>
                </div>

                <!-- 日程設定 -->
                <div class="input-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>開始日</label>
                        <input type="date" id="edit-league-start">
                    </div>
                    <div style="flex: 1;">
                        <label>終了日</label>
                        <input type="date" id="edit-league-end">
                    </div>
                </div>

                <button type="button" id="save-info-btn" class="btn" style="margin-top: 10px;">💾 大会情報を更新する</button>
            </div>
        </section>
    </div>

    <a href="menu.html" class="nav-link">← メインメニューに戻る</a>
</div>

<!-- ▼チーム募集要項設定モーダル▼ -->
<div id="edit-recruitment-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="background-color: #2c3e50; color: #ecf0f1; max-width: 480px; width: 90%;">
        <div class="modal-header" style="background-color: #1a252f; border-bottom: 1px solid #34495e; padding: 14px 20px;">
            <h3 style="margin: 0; color: var(--primary); font-size: 1.1rem;">⚙️ チーム募集要項の変更</h3>
            <button type="button" id="edit-close-recruitment-modal-btn" class="close-button" style="color: #bdc3c7;">&times;</button>
        </div>
        <div class="modal-body" style="padding: 20px; text-align: left;">
            <div class="input-group">
                <label style="font-weight: bold; color: #ecf0f1;">① リーグの公開区分</label>
                <select id="edit-setting-is-open-league">
                    <option value="false">エントリー制（限定リーグ）</option>
                    <option value="true">オープンリーグ（エントリー不要）</option>
                </select>
                <small style="display: block; margin-top: 5px; color: #bdc3c7; font-size: 0.8rem; line-height: 1.4;">
                    ※オープンリーグはエントリーしなくても試合記録ができます。
                </small>
            </div>

            <div id="edit-restricted-league-settings" style="margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.25); border-radius: 6px; border-left: 3px solid #3498db;">
                <div class="input-group">
                    <label style="font-weight: bold; color: #ecf0f1;">② 参加チーム上限</label>
                    <input type="number" id="edit-setting-max-teams" min="2" placeholder="例: 8（空欄で上限なし）">
                    <small style="display: block; margin-top: 5px; color: #bdc3c7; font-size: 0.8rem;">
                        ※大会に参加可能な最大チーム数（空欄で上限なし）
                    </small>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label style="font-weight: bold; color: #ecf0f1;">③ 1チームの登録人数上限</label>
                    <input type="number" id="edit-setting-max-members" min="1" placeholder="例: 15（空欄で上限なし）">
                    <small style="display: block; margin-top: 5px; color: #bdc3c7; font-size: 0.8rem;">
                        ※1チームあたりエントリーできる最大メンバー数（空欄で上限なし）
                    </small>
                </div>

                <div class="input-group" style="margin-top: 15px; margin-bottom: 0;">
                    <label style="font-weight: bold; color: #ecf0f1;">④ エントリー内容の変更期日</label>
                    <input type="date" id="edit-setting-entry-change-deadline">
                    <small style="display: block; margin-top: 5px; color: #bdc3c7; font-size: 0.8rem;">
                        ※エントリー後のメンバー変更や登録内容の修正を受け付ける期限日です（空欄で制限なし）。
                    </small>
                </div>
            </div>
        </div>
        <div class="modal-footer" style="background-color: #1a252f; border-top: 1px solid #34495e; padding: 12px 20px;">
            <button type="button" id="edit-confirm-recruitment-modal-btn" class="btn" style="padding: 10px; font-size: 0.95rem;">設定を反映して閉じる</button>
        </div>
    </div>
</div>

<!-- ▼登録メンバー確認用モーダル▼ -->
<div id="members-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="background-color: #2c3e50; color: #ecf0f1; max-width: 420px; width: 90%;">
        <div class="modal-header" style="background-color: #1a252f; border-bottom: 1px solid #34495e; padding: 14px 20px;">
            <h3 style="margin: 0; color: var(--primary); font-size: 1.1rem;" id="modal-team-title">登録メンバー一覧</h3>
            <button type="button" onclick="document.getElementById('members-modal').style.display='none'" class="close-button" style="color: #bdc3c7;">&times;</button>
        </div>
        <div class="modal-body" style="padding: 15px; max-height: 350px; overflow-y: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
                <thead>
                    <tr style="border-bottom: 2px solid #555;">
                        <th style="padding: 6px;">背番号</th>
                        <th style="padding: 6px;">選手名</th>
                    </tr>
                </thead>
                <tbody id="modal-member-list"></tbody>
            </table>
        </div>
        <div class="modal-footer" style="background-color: #1a252f; border-top: 1px solid #34495e; padding: 10px 20px;">
            <button type="button" onclick="document.getElementById('members-modal').style.display='none'" class="btn" style="padding: 8px;">閉じる</button>
        </div>
    </div>
</div>

<script src="js/common.js"></script>
<script>
    const GAS_URL = CONST_GAS_URL;
    let currentLeagueId = null;
    let currentOperationData = null;

    document.addEventListener('DOMContentLoaded', async () => {
        const authKey = AuthService.getApiKey();
        if (!authKey) {
            await CustomDialog.alert("ログインが必要です。再度ログインしてください。");
            window.location.href = 'index.html';
            return;
        }

        // URLパラメータから leagueId を取得
        const urlParams = new URLSearchParams(window.location.search);
        const paramLeagueId = urlParams.get('leagueId');

        await loadAdminLeagues(authKey, paramLeagueId);

        // 大会切り替えイベント
        document.getElementById('adminLeagueSelect').addEventListener('change', async (e) => {
            const leagueId = e.target.value;
            if (leagueId) {
                await loadLeagueData(leagueId, authKey);
            }
        });

        // 予選有無の切り替え
        document.getElementById('edit-league-qualifier').addEventListener('change', function() {
            document.getElementById('edit-qualifier-settings').style.display = this.value === 'true' ? 'block' : 'none';
        });

        // モーダル制御
        setupModal();

        // 情報更新保存ボタン
        document.getElementById('save-info-btn').addEventListener('click', () => updateLeagueInfo(authKey));
    });

    /**
     * タブ切り替え
     */
    function switchTab(tabName) {
        document.getElementById('tab-btn-entries').classList.toggle('active', tabName === 'entries');
        document.getElementById('tab-btn-info').classList.toggle('active', tabName === 'info');
        document.getElementById('tab-panel-entries').style.display = tabName === 'entries' ? 'block' : 'none';
        document.getElementById('tab-panel-info').style.display = tabName === 'info' ? 'block' : 'none';
    }

    /**
     * 管理大会一覧の取得
     */
    async function loadAdminLeagues(authKey, initialLeagueId) {
        const select = document.getElementById('adminLeagueSelect');
        try {
            const res = await fetch(`${GAS_URL}?mode=getAdminLeagues&authKey=${encodeURIComponent(authKey)}&_=${Date.now()}`);
            const json = await res.json();

            if (json.status === 'success' && json.leagues.length > 0) {
                select.innerHTML = '<option value="">-- 大会を選択してください --</option>';
                json.leagues.forEach(l => {
                    const opt = document.createElement('option');
                    opt.value = l.id;
                    opt.textContent = `[${l.status}] ${l.name} (${l.id})`;
                    if (initialLeagueId && l.id === initialLeagueId) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });

                // 初期選択があれば読み込み、なければ1件目を選択
                const targetId = (initialLeagueId && json.leagues.some(l => l.id === initialLeagueId))
                    ? initialLeagueId
                    : (select.options[1] ? select.options[1].value : null);

                if (targetId) {
                    select.value = targetId;
                    await loadLeagueData(targetId, authKey);
                }
            } else {
                select.innerHTML = '';
                const option = document.createElement('option');
                option.value = '';
                option.textContent = json.message || '管理している大会がありません';
                select.appendChild(option);
                document.getElementById('league-content').style.display = 'none';
            }
        } catch (e) {
            console.error(e);
            select.innerHTML = '';
            const option = document.createElement('option');
            option.value = '';
            option.textContent = e.message || '大会一覧の取得に失敗しました。';
            select.appendChild(option);
        }
    }

    /**
     * 選択された大会の運営データを読み込み
     */
    async function loadLeagueData(leagueId, authKey) {
        currentLeagueId = leagueId;
        try {
            Loading.show();
            const res = await fetch(`${GAS_URL}?mode=getLeagueOperationData&leagueId=${encodeURIComponent(leagueId)}&authKey=${encodeURIComponent(authKey)}&_=${Date.now()}`);
            const json = await res.json();
            Loading.hide();

            if (json.status === 'success') {
                currentOperationData = json;
                renderLeagueInfo(json.league);
                renderEntries(json.entries, json.league);
                document.getElementById('league-content').style.display = 'block';
            } else {
                await CustomDialog.alert(json.message || "大会データの取得に失敗しました。");
            }
        } catch (e) {
            Loading.hide();
            await CustomDialog.alert(e.message || "通信エラーが発生しました。");
        }
    }

    /**
     * 大会情報フォームへの反映
     */
    function renderLeagueInfo(league) {
        document.getElementById('edit-league-id').value = league.id;
        document.getElementById('edit-league-name').value = league.name;
        document.getElementById('edit-league-status').value = league.status || "受付中";
        document.getElementById('edit-league-start').value = league.startDate || "";
        document.getElementById('edit-league-end').value = league.endDate || "";
        document.getElementById('edit-league-match-regulation').value = league.matchRegulation || "JAPAN";
        document.getElementById('edit-league-regulation').value = league.regulation || "TOURNAMENT";
        
        const hasQual = league.hasQualifier ? "true" : "false";
        document.getElementById('edit-league-qualifier').value = hasQual;
        document.getElementById('edit-qualifier-settings').style.display = hasQual === "true" ? "block" : "none";
        document.getElementById('edit-league-qualifier-regulation').value = league.qualifierRegulation || "LEAGUE";

        // ステータスバッジ
        const statusBadge = document.getElementById('league-status-badge');
        statusBadge.textContent = league.status || "受付中";
        statusBadge.className = 'badge-status ' + (league.status === '受付中' ? 'badge-pending' : (league.status === '開催中' ? 'badge-approved' : 'badge-rejected'));
        statusBadge.style.display = 'inline-block';

        // 募集要項
        document.getElementById('edit-setting-is-open-league').value = league.isOpenLeague ? "true" : "false";
        document.getElementById('edit-setting-max-teams').value = league.maxTeams || "";
        document.getElementById('edit-setting-max-members').value = league.maxMembersPerTeam || "";
        document.getElementById('edit-setting-entry-change-deadline').value = league.entryChangeDeadline || "";
        document.getElementById('edit-restricted-league-settings').style.display = league.isOpenLeague ? 'none' : 'block';

        updateEditRecruitmentSummary();
    }

    /**
     * 申し込み一覧の描画
     */
    function renderEntries(entries, league) {
        const tbody = document.getElementById('entry-table-body');
        tbody.innerHTML = '';

        document.getElementById('entry-count-badge').textContent = `(${entries.length})`;
        document.getElementById('summary-total-entries').textContent = entries.length;

        const approvedCount = entries.filter(e => e.status === "参加").length;
        const maxTeamsTxt = league.maxTeams ? `${league.maxTeams}` : "無制限";
        document.getElementById('summary-approved-teams').textContent = `${approvedCount} / ${maxTeamsTxt}`;
        document.getElementById('summary-deadline').textContent = league.entryChangeDeadline || "設定なし";

        if (entries.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #bdc3c7; padding: 25px;">まだエントリー申し込みがありません。</td></tr>`;
            return;
        }

        entries.forEach(entry => {
            const tr = document.createElement('tr');

            // 状態バッジ
            let statusBadgeClass = 'badge-pending';
            if (entry.status === '参加') statusBadgeClass = 'badge-approved';
            if (entry.status === '不参加') statusBadgeClass = 'badge-rejected';

            tr.innerHTML = `
                <td><strong>${escapeHtml(entry.teamName)}</strong></td>
                <td>
                    <button type="button" class="btn-sm btn-reset" onclick='showMembersModal(${JSON.stringify(entry.teamName)}, ${JSON.stringify(entry.members)})'>
                        👤 ${entry.memberCount}名
                    </button>
                </td>
                <td style="font-size: 0.8rem; color: #bdc3c7;">${entry.createdAt || '-'}</td>
                <td><span class="badge-status ${statusBadgeClass}">${escapeHtml(entry.status)}</span></td>
                <td>
                    <div class="entry-action-btns">
                        ${entry.status !== '参加' ? `<button type="button" class="btn-sm btn-approve" onclick="updateStatus('${entry.entryId}', '参加')">参加</button>` : ''}
                        ${entry.status !== '不参加' ? `<button type="button" class="btn-sm btn-reject" onclick="updateStatus('${entry.entryId}', '不参加')">不参加</button>` : ''}
                        ${entry.status !== '受付中' ? `<button type="button" class="btn-sm btn-reset" onclick="updateStatus('${entry.entryId}', '受付中')">保留</button>` : ''}
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    /**
     * メンバー確認モーダルの表示
     */
    window.showMembersModal = function(teamName, members) {
        document.getElementById('modal-team-title').textContent = `${teamName} の登録メンバー`;
        const list = document.getElementById('modal-member-list');
        list.innerHTML = '';
        if (Array.isArray(members) && members.length > 0) {
            members.forEach((m, idx) => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid #444';
                tr.innerHTML = `
                    <td style="padding: 6px;">#${m.number || (idx + 1)}</td>
                    <td style="padding: 6px;">${escapeHtml(m.name || '名前なし')}</td>
                `;
                list.appendChild(tr);
            });
        } else {
            list.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #bdc3c7; padding: 15px;">メンバー情報がありません</td></tr>';
        }
        document.getElementById('members-modal').style.display = 'flex';
    };

    /**
     * 申し込みステータスの更新
     */
    window.updateStatus = async function(entryId, newStatus) {
        const isOk = await CustomDialog.confirm(`この申し込みを「${newStatus}」に設定しますか？`, '確認');
        if (!isOk) return;

        const authKey = AuthService.getApiKey();
        const payload = {
            mode: "updateLeagueEntryStatus",
            authKey: authKey,
            leagueId: currentLeagueId,
            entryId: entryId,
            status: newStatus
        };

        try {
            const res = await postToGAS(GAS_URL, payload);
            if (res.status === 'success') {
                await CustomDialog.alert(res.message || "更新しました！");
                await loadLeagueData(currentLeagueId, authKey);
            } else {
                await CustomDialog.alert(res.message || "更新に失敗しました。");
            }
        } catch (e) {
            await CustomDialog.alert(e.message || "通信エラーが発生しました。");
        }
    };

    /**
     * 大会情報の更新
     */
    async function updateLeagueInfo(authKey) {
        if (!currentLeagueId) return;

        const name = document.getElementById('edit-league-name').value.trim();
        const status = document.getElementById('edit-league-status').value;
        const start = document.getElementById('edit-league-start').value;
        const end = document.getElementById('edit-league-end').value;

        if (!name || !start || !end) {
            await CustomDialog.alert("すべての必須項目を入力してください。");
            return;
        }
        if (new Date(start) > new Date(end)) {
            await CustomDialog.alert("開始日が終了日より後になっています。");
            return;
        }

        const matchRegulation = document.getElementById('edit-league-match-regulation').value;
        const regulation = document.getElementById('edit-league-regulation').value;
        const hasQualifier = document.getElementById('edit-league-qualifier').value;
        const qualifierRegulation = hasQualifier === "true" ? document.getElementById('edit-league-qualifier-regulation').value : null;

        const isOpenLeague = document.getElementById('edit-setting-is-open-league').value;
        const maxTeams = isOpenLeague === "true" ? "" : document.getElementById('edit-setting-max-teams').value.trim();
        const maxMembersPerTeam = isOpenLeague === "true" ? "" : document.getElementById('edit-setting-max-members').value.trim();
        const entryChangeDeadline = isOpenLeague === "true" ? "" : document.getElementById('edit-setting-entry-change-deadline').value;

        if (entryChangeDeadline && start && new Date(entryChangeDeadline) > new Date(start)) {
            await CustomDialog.alert("エントリー内容の変更期日は、大会開始日以前の日付を設定してください。");
            return;
        }

        const isOk = await CustomDialog.confirm("大会情報を更新しますか？", "確認");
        if (!isOk) return;

        const btn = document.getElementById('save-info-btn');
        btn.disabled = true;
        btn.textContent = "送信中...";

        const payload = {
            mode: "updateLeagueInfo",
            authKey: authKey,
            leagueId: currentLeagueId,
            leagueName: name,
            status: status,
            startDate: start,
            endDate: end,
            matchRegulation: matchRegulation,
            regulation: regulation,
            hasQualifier: hasQualifier,
            qualifierRegulation: qualifierRegulation,
            isOpenLeague: isOpenLeague,
            maxTeams: maxTeams,
            maxMembersPerTeam: maxMembersPerTeam,
            entryChangeDeadline: entryChangeDeadline
        };

        try {
            const res = await postToGAS(GAS_URL, payload);
            if (res.status === 'success') {
                await CustomDialog.alert("大会情報を更新しました！");
                await loadLeagueData(currentLeagueId, authKey);
            } else {
                await CustomDialog.alert(res.message || "更新に失敗しました。");
            }
        } catch (e) {
            await CustomDialog.alert(e.message || "通信エラーが発生しました。");
        } finally {
            btn.disabled = false;
            btn.textContent = "💾 大会情報を更新する";
        }
    }

    /**
     * 募集要項モーダルの制御
     */
    function setupModal() {
        const modal = document.getElementById('edit-recruitment-modal');
        document.getElementById('edit-open-recruitment-modal-btn').addEventListener('click', () => {
            modal.style.display = 'flex';
        });
        document.getElementById('edit-close-recruitment-modal-btn').addEventListener('click', () => {
            modal.style.display = 'none';
        });
        document.getElementById('edit-confirm-recruitment-modal-btn').addEventListener('click', () => {
            updateEditRecruitmentSummary();
            modal.style.display = 'none';
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                updateEditRecruitmentSummary();
                modal.style.display = 'none';
            }
        });

        document.getElementById('edit-setting-is-open-league').addEventListener('change', function() {
            document.getElementById('edit-restricted-league-settings').style.display = this.value === 'true' ? 'none' : 'block';
            updateEditRecruitmentSummary();
        });
    }

    function updateEditRecruitmentSummary() {
        const isOpen = document.getElementById('edit-setting-is-open-league').value === 'true';
        const maxTeams = document.getElementById('edit-setting-max-teams').value.trim();
        const maxMembers = document.getElementById('edit-setting-max-members').value.trim();
        const deadline = document.getElementById('edit-setting-entry-change-deadline').value;
        const badge = document.getElementById('edit-recruitment-summary-badge');
        const text = document.getElementById('edit-recruitment-summary-text');

        if (isOpen) {
            badge.textContent = 'オープンリーグ';
            badge.style.background = '#2ecc71';
            text.textContent = 'エントリー不要で記録可';
        } else {
            badge.textContent = 'エントリー制';
            badge.style.background = '#3498db';
            const teamTxt = maxTeams ? `${maxTeams}チーム` : '上限なし';
            const memberTxt = maxMembers ? `${maxMembers}人` : '上限なし';
            const deadlineTxt = deadline ? `変更期日: ${deadline}` : '期日なし';
            text.textContent = `参加チーム: ${teamTxt} / 登録人数: ${memberTxt} / ${deadlineTxt}`;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }
</script>
