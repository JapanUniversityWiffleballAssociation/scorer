<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再発行 - JUWA Scorer</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #forgot-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }
        #forgot-container h2 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #333;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #495057;
            font-weight: 600;
        }
        .form-group input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input[type="email"]:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }
        #resetBtn {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        #resetBtn:hover {
            background-color: #0056b3;
        }
        #errorMessage {
            margin-top: 20px;
            font-size: 0.9rem;
            text-align: center;
            min-height: 1.5em;
            font-weight: 500;
        }
        .login-link {
            margin-top: 25px;
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            border-top: 1px solid #dee2e6;
            padding-top: 20px;
        }
        .login-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="forgot-container">
        <h2>パスワード再発行</h2>
        <div class="subtitle">登録されているメールアドレスを入力してください。新しいパスワードをメールで送信します。</div>
        
        <div class="form-group">
            <label for="reset-email">メールアドレス (ユーザーID)</label>
            <input type="email" id="reset-email" placeholder="example@juwa.com" required autocomplete="email">
        </div>
        
        <button type="button" id="resetBtn">パスワードを再発行する</button>

        <div id="errorMessage"></div>

        <div class="login-link">
            <a href="index.html">ログイン画面に戻る</a>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        const GAS_URL = CONST_GAS_URL;

        document.getElementById('resetBtn').addEventListener('click', async () => {
            const email = document.getElementById('reset-email').value.trim();
            const errorEl = document.getElementById('errorMessage');

            if (!email) {
                errorEl.textContent = "メールアドレスを入力してください。";
                errorEl.style.color = 'red';
                return;
            }

            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.textContent = "送信中...";
            errorEl.textContent = "";

            const payload = {
                mode: "resetPassword",
                email: email
            };

            try {
                const result = await postToGAS(GAS_URL, payload);
                if (result.status === "success") {
                    errorEl.textContent = result.message;
                    errorEl.style.color = 'green';
                    alert("パスワード再設定完了", result.message);
                    location.href = 'index.html'; // 成功時はログイン画面に戻る
                } else {
                    errorEl.textContent = result.message;
                    errorEl.style.color = 'red';
                }
            } catch (e) {
                errorEl.textContent = "通信エラーが発生しました: " + e.message;
                errorEl.style.color = 'red';
            } finally {
                btn.disabled = false;
                btn.textContent = "パスワードを再発行する";
            }
        });
    </script>
</body>
</html>
