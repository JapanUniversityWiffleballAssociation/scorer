<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規チーム作成 - JUWA Scorer</title>
  <link rel="stylesheet" href="style.css">
  <style>

    #create-team-container {
      max-width: 900px; /* 列が増えたため、画面幅を広く確保しました */
      margin: 50px auto;
      padding: 40px;
      background: #c5c2c2;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
      overflow: scroll
    }

    h2 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #333;
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #495057;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
    }

    /* テーブル内専用の入力ボックス・プルダウン調整 */
    .table-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    
    .table-input:focus {
      outline: none;
      border-color: #007bff;
    }

    /* テーブルスタイル */
    .member-section-title {
      font-size: 1rem;
      color: #495057;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .member-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }

    .member-table th, .member-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #dee2e6;
      text-align: left;
      vertical-align: middle;
    }

    .member-table th {
      background-color: #f8f9fa;
      font-size: 0.85rem;
      color: #495057;
      white-space: nowrap;
    }

    .text-center {
      text-align: center !important;
    }

    .admin-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .delete-row-btn {
      background: none;
      border: none;
      color: #dc3545;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 5px;
    }

    .btn-secondary {
      background-color: #6c757d;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-secondary:hover { background-color: #5a6268; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn-submit:hover { background-color: #0056b3; }

    #errorMessage {
      margin-top: 15px;
      text-align: center;
      font-size: 0.9rem;
      min-height: 1.5em;
    }

    .back-link {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
    }
    .back-link a { color: #007bff; text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <div id="create-team-container">
      <h2>新規チーム作成</h2>
      <div class="subtitle">新しいチームと、初期所属メンバーを登録します</div>

      <div class="form-group">
        <label for="teamName">チーム名</label>
        <input type="text" id="teamName" class="form-control" placeholder="例: AirFamily">
      </div>

      <div class="form-group">
        <div class="member-section-title">
          <span>初期メンバー登録</span>
          <button type="button" id="addRowBtn" class="btn-secondary">+ 選手を追加</button>
        </div>
        
        <table class="member-table" id="memberTable">
          <thead>
            <tr>
              <th style="width: 18%;">背番号</th>
              <th style="width: 25%;">選手名 <span style="color:red;">*</span></th>
              <th style="width: 17%;">投打の利き手</th>
              <th style="width: 20%;">プレイヤーID</th>
              <th style="width: 14%; text-align: center;">管理者</th>
              <th style="width: 8%; text-align: center;">削除</th>
            </tr>
          </thead>
          <tbody id="memberTableBody">
            </tbody>
        </table>
      </div>

      <button id="createTeamBtn" class="btn-submit">この内容でチームを作成</button>
      <div id="errorMessage"></div>

      <div class="back-link">
        <a href="dashboard.html">ダッシュボードへ戻る</a>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/team-create.js">
　</script>
</body>
</html>
